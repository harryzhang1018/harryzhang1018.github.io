- title: Experience
  type: time_table
  contents:
    - title: Robot Learning & Simulation Intern
      institution: Tesla, Inc. – Optimus, Palo Alto, California
      year: Sep 2025 – Jun 2026
      description:
        - Built Tesla's first internal tactile sensor simulation model on hydroelastic contact, and calibrated the mapping from contact pressure to tactile readings through sim-to-real experiments.
        - Increased GPU-batched simulation throughput by 50× over the public solver baseline by adding broad-phase collision detection and optimizing hydroelastic-contact handling.
        - Integrated the new solver, tactile simulation, and whole-body control (WBC) policy replay into the planner team's simulation platform for vision-in-the-loop evaluation of the planner–controller stack.
        - Integrated the solver into the controller team's WBC training infrastructure, which became the default workflow for controller training and simulation data collection.
        - Deployed and validated WBC policies across physics engines and physical robots, using sim-to-sim and sim-to-real results to improve the data loader, solver settings, and training infrastructure.
    - title: Simulation-Based Engineering Lab (SBEL)
      institution: University of Wisconsin–Madison, Advisor Dan Negrut
      year: Sep 2022 – Present
      description:
        - Developing Neural Reduced Dynamics (NRD), a framework that distills high-fidelity physics simulations into fast learned models for high-throughput reinforcement learning rollouts and gradient-based trajectory optimization. Validated sim-to-sim across multiple systems; extending to manipulation and legged locomotion, with sim-to-real validation planned. Under review.
        - Built a quadruped reinforcement learning framework in PyChrono with terrain-aware domain randomization and granular-terrain fine-tuning.
        - Contribute to Project Chrono and helped develop the Autonomy Research Testbed (ART), a ROS 2 platform that runs one autonomy stack in simulation and on physical ground vehicles.
        - Implemented and evaluated ground-robot path-following policies in simulation and on hardware, studying simulation fidelity and zero-shot sim-to-real transfer.
    - title: Lab Liaison, UW–Madison / Komatsu Research Collaboration
      institution: University of Wisconsin–Madison
      year: Oct 2023 – Oct 2024
      description:
        - Delivered a tracked-vehicle digital twin and simulation testbed integrating perception, planning, and control for Komatsu engineers.
        - Developed and validated obstacle-avoidance algorithms in high-fidelity simulation with engineers from Komatsu Japan.
    - title: ARC Lab
      institution: University of Wisconsin–Madison, Advisor Xiangru Xu
      year: Dec 2020 – Sep 2022
      description:
        - Implemented onboard model predictive control by integrating ACADO solvers with the ROS stack on a ground-vehicle platform.
        - Developed autonomous-driving control algorithms for the team that placed third at the national eVGrandPrix in May 2022.

